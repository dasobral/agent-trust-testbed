[workspace]
resolver = "2"
members = ["crates/att-node"]

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/dasobral/agent-trust-testbed"
authors = ["Daniel Sobral Blanco <dasobral93@gmail.com>"]

# The Agent Trust stack, in one place. Each dependency follows a branch, so a fresh
# resolve or `cargo update` takes the latest; Cargo.lock records the exact commits.
# agent-trust follows the same OpenMLS fork branch and openmls-qrand main.
[workspace.dependencies]
agent-trust = { git = "https://github.com/dasobral/agent-trust.git", branch = "main" }
openmls = { git = "https://github.com/dasobral/openmls.git", branch = "agent-trust/integration", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { git = "https://github.com/dasobral/openmls.git", branch = "agent-trust/integration", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { git = "https://github.com/dasobral/openmls.git", branch = "agent-trust/integration", features = ["clonable", "draft-ietf-mls-pq-ciphersuites"] }

# Same unification as agent-trust: openmls-qrand depends on crates.io openmls_traits.
[patch.crates-io]
openmls_traits = { git = "https://github.com/dasobral/openmls.git", branch = "agent-trust/integration" }
