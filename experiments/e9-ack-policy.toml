# E9: the policy binding travels in the canonical ack (agent-trust R-11, D-11).
#   ./attctl run experiments/e9-ack-policy.toml --backend local
# Design and expected results: docs/experiments/E9-ack-policy.md

[experiment]
id = "E9"
title = "Static apf_anchor, policy in the canonical ack, no GroupContextExtensions"
topology = "../topologies/three-agents.toml"
hypothesis = """(H1) The apf_anchor fixed at genesis is the same bytes at every member after \
every commit kind: admission, repair and rekey. (H2) Every canonical ack that a member \
merges under carries the APF's policy revision and digest at the canonical step; a \
repair ack's revision is at or above the fence revision it answers. (H3) A repair \
commit that also carries a GroupContextExtensions proposal, even one that repeats the \
current extensions, is refused and changes nothing; the plain repair then succeeds. \
(H4) The oracle accepts the trace."""

# ---------------------------------------------------------------- A: bring-up (H1, H2)
[[step]]
do = "genesis"
name = "A1 alice founds the group"
agent = "alice"

[[step]]
do = "check.anchor"
name = "A2 alice holds exactly one apf_anchor; record it as the genesis anchor"
agents = ["alice"]
record = "genesis"

[[step]]
do = "delegate"
name = "A3 delegate bob: read, write, admit"
by = "alice"
subject = "bob"
rights = ["read", "write", "admit"]

[[step]]
do = "delegate"
name = "A4 delegate carol: read, write, admit"
by = "alice"
subject = "carol"
rights = ["read", "write", "admit"]

[[step]]
do = "admit"
name = "A5 admit bob"
by = "alice"
subject = "bob"

[[step]]
do = "admit"
name = "A6 admit carol"
by = "alice"
subject = "carol"

[[step]]
do = "sync"
name = "A7 every member applies the admissions"

[[step]]
do = "check.anchor"
name = "A8 after two admissions: the genesis anchor everywhere, admit acks with the APF policy"
same_as = "genesis"
ack_kind = "admit"

[[step]]
do = "send"
name = "A9 alice sends m1"
agent = "alice"
label = "m1"
text = "m1: before the revocation"

[[step]]
do = "quiesce"
name = "A10 drain"

# ------------------------------------------------------ B: repair (H1, H2, H3)
[[step]]
do = "revoke"
name = "B1 alice revokes carol's read right: the fence closes"
by = "alice"
subject = "carol"
right = "read"

[[step]]
do = "check.apf"
name = "B2 the APF is fenced, carol still in the roster"
read_fenced = true
roster = ["alice", "bob", "carol"]

[[step]]
do = "repair_with_extensions"
name = "B3 a repair that also proposes GroupContextExtensions (the current ones) is refused"
by = "alice"
expect = "noncanonical_commit"

[[step]]
do = "check.apf"
name = "B4 nothing changed: still fenced, carol still in the roster"
read_fenced = true
roster = ["alice", "bob", "carol"]

[[step]]
do = "repair"
name = "B5 the plain repair (Removes and a path) removes carol; its ack carries the fence policy"
by = "alice"
expect_removed = ["carol"]
check_ack_policy = true

[[step]]
do = "check.anchor"
name = "B6 after the repair: the genesis anchor at alice and bob, repair acks with the APF policy"
agents = ["alice", "bob"]
same_as = "genesis"
ack_kind = "repair"

# ----------------------------------------------------------- C: rekey (H1, H2)
[[step]]
do = "revoke"
name = "C1 alice revokes bob's write right"
by = "alice"
subject = "bob"
right = "write"

[[step]]
do = "grant"
name = "C2 alice re-grants write at generation 1: a rekey offer"
by = "alice"
subject = "bob"
right = "write"
generation = 1
expect_result = { pending = true }

[[step]]
do = "rekey"
name = "C3 bob commits a new signature key (an empty commit with a path)"
agent = "bob"
right = "write"
generation = 1

[[step]]
do = "check.anchor"
name = "C4 after the rekey: the genesis anchor, update acks with the APF policy"
agents = ["alice", "bob"]
same_as = "genesis"
ack_kind = "update"

[[step]]
do = "send"
name = "C5 bob sends m2 with its new key"
agent = "bob"
label = "m2"
text = "m2: after the rekey"

[[step]]
do = "quiesce"
name = "C6 drain"

[[step]]
do = "check.delivered"
name = "C7 alice received m2"
agent = "alice"
ops = ["m2"]
exact = false

# ----------------------------------------------------------- D: verification (H4)
[[step]]
do = "check.frontiers"
name = "D1 alice and bob are on the APF frontier"
agents = ["alice", "bob"]

[[step]]
do = "check.exactly_once"
name = "D2 no delivery without APF consumption"

[[step]]
do = "check.oracle"
name = "D3 the oracle accepts the trace"

[[step]]
do = "check.broken_controls"
name = "D4 the oracle rejects the broken controls that apply"
revoked_reader = "carol"
writer = "alice"
minimum = 3

[[step]]
do = "check.no_errors"
name = "D5 the honest agents logged no processing error"
agents = ["alice", "bob"]
